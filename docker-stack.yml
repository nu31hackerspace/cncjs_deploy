version: "3.8"

services:
  app:
    image: cncjs/cncjs:v1.11.3
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --config
      - /var/lib/cncjs/.cncrc
    volumes:
      - cncjs-data:/var/lib/cncjs
    networks:
      - infra_reverse-proxy
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M

    # Serial controller, see README "Talking to a controller".
    #
    # volumes:
    #   - cncjs-data:/var/lib/cncjs
    #   - type: bind
    #     source: /dev/ttyUSB0
    #     target: /dev/ttyUSB0
    # deploy:
    #   placement:
    #     constraints:
    #       - node.labels.cncjs == true

volumes:
  cncjs-data:

networks:
  infra_reverse-proxy:
    external: true
